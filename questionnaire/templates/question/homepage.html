{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'question/homepage.css' %}">
    <title>Your Home Page</title>
</head>
<body>
    <div class="container">
        <form action="{% url 'questionnaire:sign_up_normal' %}" method="GET">
            {% csrf_token %}
            <input type="submit" value="家长注册" class="button">
        </form>

        <form action="{% url 'questionnaire:sign_up_staff' %}" method="GET">
            {% csrf_token %}
            <input type="submit" value="医生注册" class="button">
        </form>

        <form action="{% url 'questionnaire:user_login' %}" method="GET">
            {% csrf_token %}
            <input type="submit" value="登陆" class="button">
        </form>
    </div>
</body>
</html>
