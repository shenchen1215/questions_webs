{% load static %}
<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" type="text/css" href="{% static 'question/style.css' %}">
    <title>Next Question</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script> <!-- include jQuery -->
</head>
<body>
    <div id="question-container">
        <!-- Question and choices will be dynamically loaded here -->
    </div>
    <button id="next-button">下一题</button>

    <script>
        const op_questions = {{ questions|safe }};
        const op_type = {{ operation_type|safe }};
        const op_answer_time = {{ op_answer_time|safe }};
	let currentIndex ={{ current_index|safe }} ;
        let currentType = op_type;
        function displayQuestion() {
            const question = op_questions[currentType-1][currentIndex]
            const choices = question.choices;
            const pictureUrl = op_questions[currentType-1][currentIndex].picture;
            let choicesHTML = '';

            for (let ch_index = 0; ch_index < choices.length; ch_index++) {
                choicesHTML += `
                <label>
                    <input type="radio" name="choice" value="${ch_index}">
                    ${choices[ch_index].choice_text}
                </label><br>
                `;
            }

            document.getElementById('question-container').innerHTML = `
		<div class="question-content">
			<div class="text-content">
				<p> 测试类型: ${question.type} </p>
				<p> 体位: ${question.posture} </p>
				<p> 刺激物: ${question.stimulus} </p>
				<p> 项目: ${question.task} </p>
			</div>
		<img src="{% static '' %}${pictureUrl}" alt="Question Picture">
		</div>
	    	<p class="question-text">
		${question.operation_id}. ${question.question_text}
		<div class="choice-container">
			${choicesHTML}
		</div></p>
            `;
        }

        function showResults(points, staff_id) {
            let resultHTML = '<h1> Thanks </h1>';
            let totalPoints = 0;

            for (let i = 0; i < points.length; i++) {
                resultHTML += `<h1>${points[i].type} ${points[i].point}</h1>`;
                totalPoints += points[i].point;
            }
            resultHTML += `<h1>总分: ${totalPoints}</h1>`;

	    let staffQuestionsUrl = `/questionnaire/staff_questions/${staff_id}/`; // Adjust the URL pattern as needed
	    resultHTML += `<a href="${staffQuestionsUrl}" class="back-button">Back to Homepage</a>`;

            document.getElementById('question-container').innerHTML = resultHTML;
            document.getElementById('next-button').style.display = 'none';
	   
        }

        document.getElementById('next-button').addEventListener('click', () => {
            const selectedChoice = document.querySelector('input[name="choice"]:checked');
            if (selectedChoice) {
                let totalIndex = op_questions[currentType-1].length
                const choiceId = selectedChoice.value;
                console.log('Selected Choice ID:', choiceId);
		    $.ajax({
			    url: `next_question/?&totalIndex=${totalIndex}&_op_type=${currentType}&prevIndex=${currentIndex}&choice=${choiceId}&op_answer_time=${op_answer_time}`,
			type: 'GET',
			dataType: 'json',
			    success: function (data) { 
				    currentIndex = data.next_index;
				    currentType = data.next_type;
				    if (currentType < 6)
					displayQuestion();
				    else
					showResults(data.op_points, data.user_id);
			     },
			    error: function (error) {
				    console.error('Error fetching next question:', error);
				}
			
	        	});
            } else {
                console.log('No choice selected');
            }
        });

        // Initial display of the first question
        displayQuestion();
    </script>
</body>
</html>
