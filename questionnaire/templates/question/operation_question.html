
<!DOCTYPE html>
<html>
<head>
    <title>Next Question</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script> <!-- include jQuery -->
</head>
<body>
    <div id="question-container">
        <!-- Question and choices will be dynamically loaded here -->
    </div>

    <button id="next-button">Next</button>

    <script>
	const op_questions = {{questions|safe}};
	const op_type = {{operation_type|safe }};
	let prevIndex = 0;
        let currentIndex = 0;
	let currentType = 1;

        function displayQuestion(prevIndex, choice, prevType) {
	    let totalIndex = op_questions[currentType-1].length
            // Your logic to fetch and display the question using AJAX
            $.ajax({
		    url: `next_question/?&totalIndex=${totalIndex}&_op_type=${prevType}&prevIndex=${prevIndex}&choice=${choice}`,
                type: 'GET',
                dataType: 'json',
		    success: function (data) { 
			const question = op_questions[currentType-1][currentIndex]
			const choices = question.choices;
			const pictureUrl = op_questions[currentType-1][currentIndex].picture;
			let choicesHTML = '';

			for (let ch_index = 0; ch_index < choices.length; ch_index++) {
			    choicesHTML += `
				<label>
				    <input type="radio" name="choice" value="${ch_index}">
				    ${choices[ch_index].choice_text}
				</label><br>
			    `;
			}

			//console.log(pictureUrl);
			document.getElementById('question-container').innerHTML = `
			    <h1>测试类型: ${question.type}</h1>
			    <h2>体位: ${question.posture}</h2>
			    <h2>刺激物: ${question.stimulus}</h2>
			    <h2>项目: ${question.task}</h2>
			    <img src="${pictureUrl}" alt="Question Picture" style="width: 300px; height: auto;">
			    <h2>${question.question_text}</h2>
			    ${choicesHTML}
			`;
			    prevIndex = currentIndex
			    currentIndex = data.next_index;
			    currentType = data.next_type;
			    //currentIndex++;  // Increment the index for the next question
			},
			error: function (error) {
			    console.error('Error fetching next question:', error);
			}
		    });
        }

        document.getElementById('next-button').addEventListener('click', () => {
            const selectedChoice = document.querySelector('input[name="choice"]:checked');
            if (selectedChoice) {
                const choiceId = selectedChoice.value;
                console.log('Selected Choice ID:', choiceId);
		displayQuestion(prevIndex, choiceId, currentType);
            } else {
                console.log('No choice selected');
            }
		
        });

        // Initial display of the first question
        displayQuestion(currentIndex, -1, 1);
    </script>
</body>
</html>
